spring.application.name=sgsst

server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/sgsst}
spring.datasource.username=${DB_USERNAME:sgsst_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Schema e dados são versionados por migração (src/main/resources/db/migration).
# Banco já existente sem histórico do Flyway é marcado como baseline na V1
# (as tabelas da V1 já foram criadas pelo script manual em src/sql).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Origens liberadas no CORS (separadas por vírgula).
app.cors.origins=${CORS_ORIGINS:http://localhost:4200,https://sgsst-frontend-mvbu.onrender.com}

