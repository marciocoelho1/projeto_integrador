<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [ngClass]="'toast--' + toast.tipo">
      <span class="toast-icon">
        @if (toast.tipo === 'sucesso') { ✔️ }
        @else if (toast.tipo === 'erro') { ❌ }
        @else { ⚠️ }
      </span>
      <p class="toast-msg">{{ toast.mensagem }}</p>
      <button class="toast-close" (click)="toastService.remove(toast.id)" aria-label="Fechar notificação">&times;</button>
    </div>
  }
</div>
