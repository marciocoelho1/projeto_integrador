# Perfil de teste da API. Aponte DB_URL_TEST para um PostgreSQL descartável (nunca o banco real)
# e rode com SPRING_PROFILES_ACTIVE=test. O schema é criado pelas migrações do Flyway.
spring.datasource.url=${DB_URL_TEST:jdbc:postgresql://127.0.0.1:55440/sgsst}
spring.datasource.username=${DB_USERNAME_TEST:sgsst_test}
spring.datasource.password=${DB_PASSWORD_TEST:sgsst_test}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
